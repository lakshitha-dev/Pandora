[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends()/File() defaults are the framework's idiom.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]           # env vars must be set before the app is imported
"alembic/versions/*" = ["E501"]
