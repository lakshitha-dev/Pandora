name: Deploy Backend (Azure App Service)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false      # never interrupt a half-finished App Service deploy

jobs:
  build-and-deploy:
    name: Build and deploy backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Remove this step once backend/ is scaffolded.
      - name: Check backend/ exists
        id: guard
        run: |
          if [ -d backend ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::backend/ not scaffolded yet - skipping deploy."
          fi

      - name: Set up Python
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fail-fast gate: surfaces a broken requirements.txt in CI rather than as a
      # container that boots and crashes in Azure. Oryx does the real install.
      - name: Validate dependencies resolve
        if: steps.guard.outputs.ready == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy to App Service
        if: steps.guard.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_BACKEND_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_BACKEND_PUBLISH_PROFILE }}
          package: backend
