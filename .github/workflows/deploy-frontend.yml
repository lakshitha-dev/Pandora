name: Deploy Frontend (Azure Static Web Apps)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Remove this step once frontend/ is scaffolded.
      - name: Check frontend/ exists
        id: guard
        run: |
          if [ -d frontend ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/ not scaffolded yet - skipping deploy."
          fi

      - name: Build and deploy to Static Web Apps
        if: steps.guard.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend
          api_location: ""
          output_location: ""      # SWA/Oryx builds Next.js itself (hybrid/SSR)
        env:
          # NEXT_PUBLIC_* values are inlined at build time, so they must be present
          # here during `next build` - setting them in the SWA portal does nothing.
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
